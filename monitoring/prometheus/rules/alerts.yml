groups:
  - name: reminder-backend
    rules:
      - alert: BackendDown
        expr: up{job="reminder-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "백엔드 메트릭 수집 실패 ({{ $labels.instance }})"
          description: "1분 넘게 management 포트(/actuator/prometheus)를 수집하지 못했습니다. 백엔드 프로세스와 :8090 응답, Prometheus /targets의 오류를 확인하세요."

      - alert: HighServerErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        labels:
          severity: critical
        annotations:
          summary: "5xx 응답 비율 5% 초과"
          description: "최근 5분간 5xx 응답 비율이 5%를 넘었습니다. '백엔드 개요' 대시보드에서 상태 코드와 경로를 확인하고 백엔드 ERROR 로그를 보세요."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[10m]))) > 1
        labels:
          severity: warning
        annotations:
          summary: "API 응답 시간 p95 1초 초과"
          description: "최근 10분간 API 응답 시간 p95가 1초를 넘었습니다. '백엔드 개요'의 경로별 p95와 'JVM·DB' 대시보드의 커넥션 대기·GC를 확인하세요."

      - alert: DbConnectionPending
        expr: max by (instance, pool) (hikaricp_connections_pending) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DB 커넥션 대기 계속 ({{ $labels.pool }})"
          description: "5분 넘게 커넥션을 기다리는 요청이 있습니다. 'JVM·DB' 대시보드에서 활성·대기 커넥션과 획득 시간을 확인하고, 오래 걸리는 쿼리나 풀 크기를 점검하세요."

      - alert: JvmHeapHigh
        expr: |
          sum by (instance) (jvm_memory_used_bytes{area="heap"})
            / sum by (instance) (jvm_memory_max_bytes{area="heap"} > 0) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "힙 사용률 90% 초과 ({{ $labels.instance }})"
          description: "10분 넘게 힙 사용률이 90%를 넘었습니다. 'JVM·DB' 대시보드에서 힙과 GC 추세를 확인하고 메모리 누수나 힙 크기를 점검하세요."

      - alert: LoginLockSpike
        expr: sum(increase(reminder_auth_login_locks_total[10m])) >= 10
        labels:
          severity: warning
        annotations:
          summary: "로그인 차단 급증 (10분간 10회 이상)"
          description: "최근 10분간 로그인 차단이 10회 이상 시작되었습니다. 무차별 대입 시도일 수 있습니다. '인증·보안' 대시보드에서 이메일·IP별 차단과 로그인 실패 추세를 확인하세요."

      - alert: RefreshTokenReuseDetected
        expr: sum(increase(reminder_auth_refresh_reuse_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "리프레시 토큰 재사용 감지"
          description: "최근 5분 안에 폐기된 리프레시 토큰의 재사용이 감지되었습니다. 토큰 탈취 가능성이 있습니다. '인증·보안' 대시보드와 백엔드 WARN 로그를 확인하세요."

      - alert: LoginAttemptStoreFailOpen
        expr: sum(increase(reminder_auth_login_attempt_store_errors_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "로그인 시도 저장소 오류로 차단 없이 통과"
          description: "최근 5분 안에 로그인 시도 저장소(Redis) 오류로 차단 확인 없이 로그인을 통과시켰습니다(fail-open). Redis 상태와 백엔드 ERROR 로그를 확인하세요. '인증·보안' 대시보드의 저장소 오류 패널을 보세요."
