spring:
  application:
    name: reminder
  datasource:
    url: jdbc:h2:mem:reminderdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    # SQL은 System.out 대신 org.hibernate.SQL 로거로 출력해 로그 패턴과 MDC(request_id)가 적용되게 한다.
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  pattern:
    # request_id는 HttpLoggingFilter가 요청마다 MDC에 넣는다. 요청 밖에서 찍히는 로그(기동 등)는 startup으로 표시한다.
    console: '[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%-5level] [%thread] [%logger{0}:%line] [%X{request_id:-startup}] - %msg%n'
  level:
    org.hibernate.SQL: debug
