server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: reminder
  datasource:
    url: jdbc:h2:file:./data/reminderdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  pattern:
    console: '[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%-5level] [%thread] [%logger{0}:%line] [%X{request_id:-startup}] - %msg%n'
  level:
    org.hibernate.SQL: debug
