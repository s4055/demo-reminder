server:
  servlet:
    session:
      cookie:
        # 세션 쿠키를 JS에서 읽지 못하게 하고, 다른 사이트에서 시작된 POST 등에는 싣지 않는다 (CSRF 토큰을 쓰지 않는 전제).
        # 브라우저마다 SameSite 기본값이 달라 명시한다. localhost:3000 → :8080은 같은 사이트라 쿠키가 전송된다.
        http-only: true
        same-site: lax

spring:
  application:
    name: reminder
  datasource:
    # 재시작해도 데이터가 남도록 파일 모드로 저장한다 (backend/data/reminderdb.mv.db). 초기화하려면 파일을 지운다.
    # 테스트는 src/test/resources/application.properties에서 in-memory DB로 바꾼다.
    url: jdbc:h2:file:./data/reminderdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    # 영속성 컨텍스트를 트랜잭션(서비스) 범위로 제한한다. 엔티티는 서비스 안에서 응답 DTO로 바꿔 반환하므로
    # 컨트롤러나 뷰에서 지연 로딩할 일이 없고, 요청이 끝날 때까지 DB 커넥션을 붙잡지 않는다.
    open-in-view: false
    hibernate:
      ddl-auto: update
    # SQL은 System.out 대신 org.hibernate.SQL 로거로 출력해 로그 패턴과 MDC(request_id)가 적용되게 한다.
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  pattern:
    # request_id는 HttpLoggingFilter가 요청마다 MDC에 넣는다. 요청 밖에서 찍히는 로그(기동 등)는 startup으로 표시한다.
    console: '[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%-5level] [%thread] [%logger{0}:%line] [%X{request_id:-startup}] - %msg%n'
  level:
    org.hibernate.SQL: debug
