spring:
  application:
    name: reminder
  datasource:
    url: jdbc:h2:file:./data/reminderdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
      repositories:
        enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  auth:
    login-attempt:
      max-failures-per-email: 5
      max-failures-per-ip: 20
      window: 15m
      lock-duration: 15m
      store: ${LOGIN_ATTEMPT_STORE:memory}
  jwt:
    secret: ${JWT_SECRET:local-only-jwt-secret-key-do-not-use-in-production}
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  logging:
    http:
      excluded-paths:
        - ${spring.h2.console.path}

logging:
  pattern:
    console: '[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%-5level] [%thread] [%logger{0}:%line] [%X{request_id:-startup}] - %msg%n'
  level:
    org.hibernate.SQL: debug
