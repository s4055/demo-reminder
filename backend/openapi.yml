openapi: 3.0.3
info:
  title: demoreminder API
  description: Apple Reminders 웹 클론 (demoreminder) 백엔드 API. 현재는 Phase 4(리마인더 상세 편집, 리스트 수정)까지의 범위를 포함한다.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버

tags:
  - name: Lists
    description: 리스트 조회/생성/수정/삭제
  - name: Reminders
    description: 리마인더 조회/생성/수정/완료·플래그 토글/삭제, 스마트 뷰 조회

paths:
  /api/lists:
    get:
      tags: [Lists]
      summary: 리스트 전체 조회 (미완료 리마인더 개수 포함)
      operationId: getLists
      responses:
        "200":
          description: 리스트 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReminderListResponse"
    post:
      tags: [Lists]
      summary: 리스트 생성
      operationId: createList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderListRequest"
      responses:
        "201":
          description: 생성된 리스트
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListResponse"
        "400":
          description: 유효성 검증 실패 (name 누락, color 형식 오류 등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/lists/{id}:
    put:
      tags: [Lists]
      summary: 리스트 이름/색상 수정
      operationId: updateList
      parameters:
        - $ref: "#/components/parameters/ListId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderListRequest"
      responses:
        "200":
          description: 수정된 리스트
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListResponse"
        "400":
          description: 유효성 검증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 리스트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Lists]
      summary: 리스트 삭제 (소속 리마인더도 함께 삭제)
      operationId: deleteList
      parameters:
        - $ref: "#/components/parameters/ListId"
      responses:
        "204":
          description: 삭제 성공
        "404":
          description: 리스트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reminders:
    get:
      tags: [Reminders]
      summary: 리마인더 전체 조회
      operationId: getReminders
      parameters:
        - name: listId
          in: query
          required: false
          description: 지정하면 해당 리스트에 소속된 리마인더만 조회한다. 생략하면 전체를 조회한다.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 리마인더 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReminderResponse"
    post:
      tags: [Reminders]
      summary: 리마인더 생성
      operationId: createReminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderRequest"
      responses:
        "201":
          description: 생성된 리마인더
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
        "400":
          description: 유효성 검증 실패 (title 누락 등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: listId에 해당하는 리스트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reminders/smart/{view}:
    get:
      tags: [Reminders]
      summary: 스마트 뷰 조회
      description: |
        조건에 맞는 리마인더를 자동으로 모아 보여주는 뷰.
        - `today`: 마감일이 오늘인 미완료
        - `scheduled`: 마감일이 설정된 모든 미완료 (마감일 순)
        - `all`: 모든 미완료
        - `flagged`: flagged=true 인 미완료
        - `completed`: completed=true 인 리마인더
      operationId: getSmartReminders
      parameters:
        - name: view
          in: path
          required: true
          schema:
            type: string
            enum: [today, scheduled, all, flagged, completed]
      responses:
        "200":
          description: 뷰 조건에 맞는 리마인더 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReminderResponse"
        "400":
          description: 지원하지 않는 뷰 이름
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reminders/{id}/flag:
    patch:
      tags: [Reminders]
      summary: 리마인더 플래그 상태 토글
      operationId: toggleReminderFlag
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      responses:
        "200":
          description: 플래그 상태가 토글된 리마인더
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
        "404":
          description: 리마인더를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reminders/{id}/complete:
    patch:
      tags: [Reminders]
      summary: 리마인더 완료 상태 토글
      operationId: toggleReminderComplete
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      responses:
        "200":
          description: 완료 상태가 토글된 리마인더
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
        "404":
          description: 리마인더를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reminders/{id}:
    put:
      tags: [Reminders]
      summary: 리마인더 수정 (제목/메모/마감일시/플래그 전체 교체)
      description: 요청 본문의 값으로 제목, 메모, 마감일시, 플래그를 교체한다. memo/dueAt을 생략하거나 null로 보내면 비워진다. flagged는 필수다. 완료 상태와 소속 리스트는 변경되지 않는다.
      operationId: updateReminder
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderUpdateRequest"
      responses:
        "200":
          description: 수정된 리마인더
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
        "400":
          description: 유효성 검증 실패 (title 누락 등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 리마인더를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Reminders]
      summary: 리마인더 삭제
      operationId: deleteReminder
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      responses:
        "204":
          description: 삭제 성공
        "404":
          description: 리마인더를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    ListId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    ReminderId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    ReminderRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          example: 우유 사기
        memo:
          type: string
          nullable: true
          example: 저지방
        listId:
          type: integer
          format: int64
          nullable: true
          description: 소속 리스트 ID. 생략하면 리스트 없이 생성된다.
        dueAt:
          type: string
          format: date-time
          nullable: true
          description: 마감 일시 (타임존 없는 로컬 일시, 예 2026-09-20T18:30:00)
          example: "2026-09-20T18:30:00"

    ReminderUpdateRequest:
      type: object
      required: [title, flagged]
      properties:
        title:
          type: string
          minLength: 1
          example: 계란 사기
        memo:
          type: string
          nullable: true
          example: 12구
        dueAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-09-21T09:00:00"
        flagged:
          type: boolean

    ReminderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        memo:
          type: string
          nullable: true
        completed:
          type: boolean
        flagged:
          type: boolean
        dueAt:
          type: string
          format: date-time
          nullable: true
        listId:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReminderListRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: 장보기
        color:
          type: string
          nullable: true
          pattern: "^#[0-9a-fA-F]{6}$"
          example: "#FF9500"

    ReminderListResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        color:
          type: string
          nullable: true
        reminderCount:
          type: integer
          format: int64
          description: 리스트에 속한 미완료 리마인더 개수
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        path:
          type: string
