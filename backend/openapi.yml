openapi: 3.0.3
info:
  title: demoreminder API
  description: |
    Apple Reminders 웹 클론 (demoreminder) 백엔드 API. 현재는 Phase 8(태그)까지의 범위를 포함한다.

    모든 응답(성공/실패)은 `{ resultCode, resultMsg, data }` 형태다. 성공 시 `resultCode`는 `SUCCESS`이고 결과는 `data`에 담긴다.
    실패 시 HTTP 상태 코드와 함께 `resultCode`에 오류 종류, `resultMsg`에 원인이 담기며 `data`는 null이다.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버

tags:
  - name: Lists
    description: 리스트 조회/생성/수정/삭제
  - name: Reminders
    description: 리마인더 조회/생성/수정/완료·플래그 토글/삭제/순서 변경, 스마트 뷰 조회
  - name: Tags
    description: 태그 조회/삭제 (태그 생성은 리마인더 생성/수정의 tagNames로 한다)

paths:
  /api/lists:
    get:
      tags: [Lists]
      summary: 리스트 전체 조회 (표시 순서대로, 미완료 리마인더 개수 포함)
      operationId: getLists
      responses:
        "200":
          description: 리스트 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListArrayApiResponse"
    post:
      tags: [Lists]
      summary: 리스트 생성 (마지막 순서로 추가)
      operationId: createList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderListRequest"
      responses:
        "201":
          description: 생성된 리스트
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListApiResponse"
        "400":
          description: 유효성 검증 실패 (name 누락, color 형식 오류 등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/lists/order:
    patch:
      tags: [Lists]
      summary: 리스트 순서 일괄 변경
      description: 요청한 ids 순서대로 리스트의 표시 순서(sortOrder)를 0부터 다시 매긴다. ids에는 모든 리스트의 id가 빠짐없이 한 번씩 들어 있어야 한다.
      operationId: reorderLists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListOrderRequest"
      responses:
        "200":
          description: 변경 성공 (data는 null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "400":
          description: ids 누락, 또는 ids가 전체 리스트와 정확히 일치하지 않음 (누락/중복/없는 id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/lists/{id}:
    put:
      tags: [Lists]
      summary: 리스트 이름/색상 수정
      operationId: updateList
      parameters:
        - $ref: "#/components/parameters/ListId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderListRequest"
      responses:
        "200":
          description: 수정된 리스트
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListApiResponse"
        "400":
          description: 유효성 검증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 리스트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Lists]
      summary: 리스트 삭제 (소속 리마인더도 함께 삭제)
      operationId: deleteList
      parameters:
        - $ref: "#/components/parameters/ListId"
      responses:
        "200":
          description: 삭제 성공 (data는 null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "404":
          description: 리스트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reminders:
    get:
      tags: [Reminders]
      summary: 리마인더 전체 조회
      operationId: getReminders
      parameters:
        - name: listId
          in: query
          required: false
          description: 지정하면 해당 리스트의 최상위 리마인더만 표시 순서(sortOrder)대로 조회하고, 하위 작업은 각 항목의 subtasks에 담는다. listId와 tag를 모두 생략하면 하위 작업을 포함한 전체를 생성순으로 조회하고, 둘 다 지정하면 listId가 우선한다.
          schema:
            type: integer
            format: int64
        - name: tag
          in: query
          required: false
          description: 지정하면 이 이름의 태그가 붙은 리마인더만 생성순으로 조회한다. 하위 작업도 개별 항목으로 포함된다.
          schema:
            type: string
            example: 집
      responses:
        "200":
          description: 리마인더 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderArrayApiResponse"
    post:
      tags: [Reminders]
      summary: 리마인더 생성 (같은 리스트의 마지막 순서로 추가)
      description: |
        tagNames의 태그 중 없는 태그는 새로 만든다.
        parentId를 지정하면 그 리마인더의 하위 작업으로 만든다. 하위 작업은 listId와 관계없이 부모의 리스트에 속하고, 부모의 하위 작업 중 마지막 순서로 추가된다.
        하위 작업의 하위 작업은 만들 수 없다 (깊이 1단계).
      operationId: createReminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderRequest"
      responses:
        "201":
          description: 생성된 리마인더
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderApiResponse"
        "400":
          description: 유효성 검증 실패 (title 누락, 지원하지 않는 priority 값, 빈 태그 이름이나 50자를 넘는 태그 이름 등), 또는 parentId가 이미 하위 작업인 리마인더
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: listId에 해당하는 리스트, 또는 parentId에 해당하는 리마인더를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reminders/order:
    patch:
      tags: [Reminders]
      summary: 리스트 안 리마인더 순서 일괄 변경
      description: |
        요청한 ids 순서대로 해당 리스트의 최상위 미완료 리마인더 표시 순서(sortOrder)를 0부터 다시 매긴다.
        ids에는 그 리스트의 최상위 미완료 리마인더 id가 빠짐없이 한 번씩 들어 있어야 한다 (완료 항목, 하위 작업, 다른 리스트의 항목은 넣을 수 없다).
        스마트 뷰의 정렬에는 영향을 주지 않는다.
      operationId: reorderReminders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderOrderRequest"
      responses:
        "200":
          description: 변경 성공 (data는 null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "400":
          description: listId/ids 누락, 또는 ids가 대상 리마인더와 정확히 일치하지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: listId에 해당하는 리스트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reminders/smart/{view}:
    get:
      tags: [Reminders]
      summary: 스마트 뷰 조회
      description: |
        조건에 맞는 리마인더를 자동으로 모아 보여주는 뷰. 리스트 안 순서 변경(sortOrder)과 무관하게 아래 정렬을 따른다.
        하위 작업도 조건에 맞으면 개별 항목으로 포함된다.
        - `today`: 마감일이 오늘인 미완료
        - `scheduled`: 마감일이 설정된 모든 미완료 (마감일 순)
        - `all`: 모든 미완료
        - `flagged`: flagged=true 인 미완료
        - `completed`: completed=true 인 리마인더 (완료일시 최신순)
      operationId: getSmartReminders
      parameters:
        - name: view
          in: path
          required: true
          schema:
            type: string
            enum: [today, scheduled, all, flagged, completed]
      responses:
        "200":
          description: 뷰 조건에 맞는 리마인더 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderArrayApiResponse"
        "400":
          description: 지원하지 않는 뷰 이름
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reminders/{id}/flag:
    patch:
      tags: [Reminders]
      summary: 리마인더 플래그 상태 토글
      operationId: toggleReminderFlag
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      responses:
        "200":
          description: 플래그 상태가 토글된 리마인더
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderApiResponse"
        "404":
          description: 리마인더를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reminders/{id}/complete:
    patch:
      tags: [Reminders]
      summary: 리마인더 완료 상태 토글
      description: 완료 처리하면 아직 완료되지 않은 하위 작업도 함께 완료된다. 완료를 취소할 때는 하위 작업의 상태를 바꾸지 않는다.
      operationId: toggleReminderComplete
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      responses:
        "200":
          description: 완료 상태가 토글된 리마인더
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderApiResponse"
        "404":
          description: 리마인더를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reminders/{id}:
    put:
      tags: [Reminders]
      summary: 리마인더 수정 (제목/메모/마감일시/플래그/우선순위/태그 전체 교체)
      description: 요청 본문의 값으로 제목, 메모, 마감일시, 플래그, 우선순위, 태그를 교체한다. memo/dueAt을 생략하거나 null로 보내면 비워지고, priority를 생략하거나 null로 보내면 NONE이 되며, tagNames를 생략하거나 null로 보내면 태그가 모두 떨어진다. flagged는 필수다. 완료 상태와 소속 리스트는 변경되지 않는다.
      operationId: updateReminder
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderUpdateRequest"
      responses:
        "200":
          description: 수정된 리마인더
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderApiResponse"
        "400":
          description: 유효성 검증 실패 (title 누락, 지원하지 않는 priority 값, 빈 태그 이름이나 50자를 넘는 태그 이름 등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 리마인더를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Reminders]
      summary: 리마인더 삭제
      description: 하위 작업이 있으면 함께 삭제된다. 하위 작업을 삭제하면 부모와 다른 하위 작업은 유지된다.
      operationId: deleteReminder
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      responses:
        "200":
          description: 삭제 성공 (data는 null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "404":
          description: 리마인더를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/tags:
    get:
      tags: [Tags]
      summary: 태그 목록 조회 (이름순, 미완료 리마인더 개수 포함)
      description: 어떤 리마인더에도 붙어 있지 않은 태그는 제외한다.
      operationId: getTags
      responses:
        "200":
          description: 태그 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagArrayApiResponse"

  /api/tags/{id}:
    delete:
      tags: [Tags]
      summary: 태그 삭제 (리마인더에서 떼어내고 리마인더 자체는 유지)
      operationId: deleteTag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 삭제 성공 (data는 null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "404":
          description: 태그를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    ListId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    ReminderId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    ReminderRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          example: 우유 사기
        memo:
          type: string
          nullable: true
          example: 저지방
        listId:
          type: integer
          format: int64
          nullable: true
          description: 소속 리스트 ID. 생략하면 리스트 없이 생성된다. parentId를 지정하면 무시된다.
        parentId:
          type: integer
          format: int64
          nullable: true
          description: 부모 리마인더 ID. 지정하면 하위 작업으로 생성되며 부모의 리스트에 속한다. 하위 작업은 부모가 될 수 없다.
        dueAt:
          type: string
          format: date-time
          nullable: true
          description: 마감 일시 (타임존 없는 로컬 일시, 예 2026-09-20T18:30:00)
          example: "2026-09-20T18:30:00"
        priority:
          allOf:
            - $ref: "#/components/schemas/Priority"
          nullable: true
          description: 우선순위. 생략하거나 null이면 NONE으로 저장된다.
        tagNames:
          $ref: "#/components/schemas/TagNames"

    ReminderUpdateRequest:
      type: object
      required: [title, flagged]
      properties:
        title:
          type: string
          minLength: 1
          example: 계란 사기
        memo:
          type: string
          nullable: true
          example: 12구
        dueAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-09-21T09:00:00"
        flagged:
          type: boolean
        priority:
          allOf:
            - $ref: "#/components/schemas/Priority"
          nullable: true
          description: 우선순위. 생략하거나 null이면 NONE으로 바뀐다.
        tagNames:
          $ref: "#/components/schemas/TagNames"

    TagNames:
      type: array
      nullable: true
      description: 붙일 태그 이름 목록. 앞뒤 공백은 제거되고 중복은 하나로 합쳐지며, 없는 태그는 새로 만든다. 생략하거나 null이면 태그 없음.
      items:
        type: string
        minLength: 1
        maxLength: 50
      example: [집, 심부름]

    ListOrderRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          description: 새 표시 순서대로 나열한 모든 리스트의 id
          items:
            type: integer
            format: int64
          example: [3, 1, 2]

    ReminderOrderRequest:
      type: object
      required: [listId, ids]
      properties:
        listId:
          type: integer
          format: int64
        ids:
          type: array
          description: 새 표시 순서대로 나열한, 해당 리스트의 모든 미완료 리마인더 id
          items:
            type: integer
            format: int64
          example: [12, 10, 11]

    Priority:
      type: string
      enum: [NONE, LOW, MEDIUM, HIGH]
      description: 리마인더 우선순위 (없음/낮음/보통/높음). 목록에서는 LOW/MEDIUM/HIGH를 각각 !, !!, !!!로 표시한다.
      example: HIGH

    ReminderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        memo:
          type: string
          nullable: true
        completed:
          type: boolean
        flagged:
          type: boolean
        priority:
          $ref: "#/components/schemas/Priority"
        dueAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: 완료 처리한 일시. 미완료 상태이면 null
        listId:
          type: integer
          format: int64
          nullable: true
        sortOrder:
          type: integer
          description: 같은 리스트 안의 표시 순서(하위 작업은 부모 안에서의 순서). 작을수록 위
        tags:
          type: array
          description: 붙은 태그 이름 목록 (이름순)
          items:
            type: string
          example: [심부름, 집]
        parentId:
          type: integer
          format: int64
          nullable: true
          description: 부모 리마인더 ID. 최상위 리마인더이면 null
        subtasks:
          type: array
          description: 하위 작업 목록 (부모 안의 순서대로). 하위 작업 자신의 subtasks는 항상 빈 배열이다.
          items:
            $ref: "#/components/schemas/ReminderResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReminderListRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: 장보기
        color:
          type: string
          nullable: true
          pattern: "^#[0-9a-fA-F]{6}$"
          example: "#FF9500"

    ReminderListResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        color:
          type: string
          nullable: true
        sortOrder:
          type: integer
          description: 사이드바 표시 순서. 작을수록 위
        reminderCount:
          type: integer
          format: int64
          description: 리스트에 속한 최상위 미완료 리마인더 개수 (하위 작업 제외)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TagResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: 집
        reminderCount:
          type: integer
          format: int64
          description: 이 태그가 붙은 미완료 리마인더 개수
        createdAt:
          type: string
          format: date-time

    ApiResult:
      type: object
      description: 모든 API 응답에 공통으로 포함되는 결과 코드와 메시지
      required: [resultCode, resultMsg]
      properties:
        resultCode:
          type: string
          enum: [SUCCESS, BAD_REQUEST, NOT_FOUND, METHOD_NOT_ALLOWED, INTERNAL_SERVER_ERROR]
          description: |
            - `SUCCESS`: 성공
            - `BAD_REQUEST`: 유효성 검증 실패, 본문 형식 오류, 지원하지 않는 값 등 4xx 요청 오류
            - `NOT_FOUND`: 대상을 찾을 수 없음
            - `METHOD_NOT_ALLOWED`: 지원하지 않는 HTTP 메서드
            - `INTERNAL_SERVER_ERROR`: 서버 오류
          example: SUCCESS
        resultMsg:
          type: string
          description: '결과 메시지. 성공 시 "성공", 실패 시 원인 (유효성 검증 실패는 "필드: 메시지"를 쉼표로 연결)'
          example: 성공

    ReminderApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResult"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ReminderResponse"

    ReminderArrayApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResult"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ReminderResponse"

    ReminderListApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResult"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ReminderListResponse"

    ReminderListArrayApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResult"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ReminderListResponse"

    TagArrayApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResult"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/TagResponse"

    EmptyApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResult"
        - type: object
          properties:
            data:
              type: object
              nullable: true
              description: 항상 null
              example: null

    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResult"
        - type: object
          properties:
            data:
              type: object
              nullable: true
              description: 항상 null
              example: null
      example:
        resultCode: NOT_FOUND
        resultMsg: "Reminder not found: 1"
        data: null
