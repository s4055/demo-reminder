openapi: 3.0.3
info:
  title: demoreminder API
  description: |
    Apple Reminders 웹 클론 (demoreminder) 백엔드 API. 현재는 Phase 13(리스트 공유/협업)까지의 범위를 포함한다.

    모든 응답(성공/실패)은 `{ resultCode, resultMsg, data }` 형태다. 성공 시 `resultCode`는 `SUCCESS`이고 결과는 `data`에 담긴다.
    실패 시 HTTP 상태 코드와 함께 `resultCode`에 오류 종류, `resultMsg`에 원인이 담기며 `data`는 null이다.

    **인증**: 세션(쿠키) 기반이다. `/api/auth/signup` 또는 `/api/auth/login`이 성공하면 `JSESSIONID` 쿠키가 발급되고,
    이후 요청에 이 쿠키를 보내야 한다 (브라우저에서는 `credentials: "include"`). 회원가입/로그인/로그아웃을 제외한 모든 API는
    로그인이 필요하며, 로그인하지 않으면 401(`UNAUTHORIZED`)로 응답한다.

    **데이터 격리**: 리스트/리마인더/태그는 사용자별로 분리된다. 목록 조회는 로그인한 사용자의 데이터만 반환하고,
    다른 사용자의 리소스 id로 조회/수정/삭제하면 존재 여부를 드러내지 않도록 404(`NOT_FOUND`)로 응답한다.

    **리스트 공유**: 리스트 소유자는 다른 사용자를 이메일로 초대해 리스트를 함께 쓸 수 있다. 소유자도 `OWNER` 멤버이고,
    초대받은 사용자는 `EDITOR` 멤버가 된다. 멤버는 리스트의 리마인더를 누가 만들었든 조회/생성/수정/완료/플래그/순서 변경/삭제할 수 있고,
    리스트 목록·스마트 뷰·태그별/전체 조회·다가오는 리마인더에도 공유받은 리스트의 리마인더가 포함된다.
    리스트 자체의 수정/삭제와 멤버 초대/제거는 소유자만 할 수 있으며, 멤버가 이를 시도하면 403(`FORBIDDEN`)으로 응답한다.
    멤버가 아닌 사용자에게는 리스트와 그 리마인더가 없는 것처럼 404로 응답한다. 리스트 없이 만든 리마인더는 만든 사용자만 볼 수 있다.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버

security:
  - sessionCookie: []

tags:
  - name: Auth
    description: 회원가입/로그인/로그아웃, 현재 사용자 조회 (세션 쿠키 기반)
  - name: Lists
    description: 리스트 조회/생성/수정/삭제
  - name: List Members
    description: 리스트 공유 (멤버 조회/초대/제거, 나가기)
  - name: Reminders
    description: 리마인더 조회/생성/수정/완료·플래그 토글/삭제/순서 변경, 스마트 뷰 조회
  - name: Tags
    description: 태그 조회/삭제 (태그 생성은 리마인더 생성/수정의 tagNames로 한다)

paths:
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: 회원가입 (가입 즉시 로그인)
      description: |
        이메일은 앞뒤 공백을 지우고 소문자로 저장하므로 대소문자만 다른 이메일로는 다시 가입할 수 없다.
        비밀번호는 BCrypt 해시로 저장한다. 가입에 성공하면 로그인된 세션의 `JSESSIONID` 쿠키를 발급한다.
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: 가입한 사용자 (Set-Cookie로 세션 쿠키 발급)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserApiResponse"
        "400":
          description: 유효성 검증 실패 (이메일 형식, 비밀번호 8자 미만 또는 72바이트 초과, 이름 누락 등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 이미 가입한 이메일
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      description: 성공하면 세션 ID를 새로 발급하고(세션 고정 방지) 로그인 정보를 세션에 저장한다. 이메일 대소문자는 구분하지 않는다.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인한 사용자 (Set-Cookie로 세션 쿠키 발급)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserApiResponse"
        "400":
          description: email 또는 password 누락
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 이메일 또는 비밀번호가 틀림 (어느 쪽이 틀렸는지 구분하지 않는다)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      description: 세션을 무효화한다. 로그인하지 않은 상태에서 호출해도 성공으로 응답한다.
      operationId: logout
      security: []
      responses:
        "200":
          description: 로그아웃 성공 (data는 null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: 현재 로그인한 사용자 조회
      operationId: getMe
      responses:
        "200":
          description: 로그인한 사용자
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/lists:
    get:
      tags: [Lists]
      summary: 리스트 전체 조회 (소유한 리스트와 공유받은 리스트, 미완료 리마인더 개수 포함)
      description: 소유한 리스트를 표시 순서(sortOrder)대로 먼저, 공유받은 리스트를 공유받은 순서대로 뒤에 반환한다.
      operationId: getLists
      responses:
        "200":
          description: 리스트 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListArrayApiResponse"
    post:
      tags: [Lists]
      summary: 리스트 생성 (마지막 순서로 추가, 만든 사용자가 OWNER 멤버)
      operationId: createList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderListRequest"
      responses:
        "201":
          description: 생성된 리스트
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListApiResponse"
        "400":
          description: 유효성 검증 실패 (name 누락, color 형식 오류 등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/lists/order:
    patch:
      tags: [Lists]
      summary: 리스트 순서 일괄 변경
      description: |
        요청한 ids 순서대로 리스트의 표시 순서(sortOrder)를 0부터 다시 매긴다. ids에는 소유한 모든 리스트의 id가 빠짐없이 한 번씩 들어 있어야 한다.
        공유받은 리스트는 순서 변경 대상이 아니므로 넣으면 400이다.
      operationId: reorderLists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListOrderRequest"
      responses:
        "200":
          description: 변경 성공 (data는 null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "400":
          description: ids 누락, 또는 ids가 소유한 전체 리스트와 정확히 일치하지 않음 (누락/중복/없는 id/공유받은 리스트 id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/lists/{id}:
    put:
      tags: [Lists]
      summary: 리스트 이름/색상 수정 (소유자만)
      operationId: updateList
      parameters:
        - $ref: "#/components/parameters/ListId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderListRequest"
      responses:
        "200":
          description: 수정된 리스트
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListApiResponse"
        "400":
          description: 유효성 검증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          description: 리스트를 찾을 수 없음 (멤버가 아닌 리스트 포함)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Lists]
      summary: 리스트 삭제 (소유자만, 다른 멤버가 만든 것을 포함한 소속 리마인더와 멤버 정보도 함께 삭제)
      operationId: deleteList
      parameters:
        - $ref: "#/components/parameters/ListId"
      responses:
        "200":
          description: 삭제 성공 (data는 null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          description: 리스트를 찾을 수 없음 (멤버가 아닌 리스트 포함)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/lists/{listId}/members:
    get:
      tags: [List Members]
      summary: 리스트 멤버 조회 (멤버 누구나)
      description: 소유자를 먼저, 나머지 멤버를 초대한 순서대로 반환한다.
      operationId: getListMembers
      parameters:
        - $ref: "#/components/parameters/MemberListId"
      responses:
        "200":
          description: 멤버 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMemberArrayApiResponse"
        "404":
          description: 리스트를 찾을 수 없음 (멤버가 아닌 리스트 포함)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [List Members]
      summary: 이메일로 멤버 초대 (소유자만)
      description: 가입한 사용자만 초대할 수 있으며, 초대받은 사용자는 바로 `EDITOR` 멤버가 된다. 이메일 대소문자는 구분하지 않는다.
      operationId: inviteListMember
      parameters:
        - $ref: "#/components/parameters/MemberListId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListMemberRequest"
      responses:
        "201":
          description: 추가된 멤버
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMemberApiResponse"
        "400":
          description: 이메일 누락/형식 오류, 또는 이미 멤버인 사용자 (소유자 본인 포함)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          description: 리스트를 찾을 수 없음 (멤버가 아닌 리스트 포함), 또는 해당 이메일로 가입한 사용자가 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/lists/{listId}/members/{userId}:
    delete:
      tags: [List Members]
      summary: 멤버 제거 (소유자만) / 리스트 나가기 (userId가 본인)
      description: |
        userId가 본인이면 리스트에서 나가고, 다른 사용자이면 그 멤버를 제거한다(소유자만).
        소유자는 나가거나 제거될 수 없다. 나간(제거된) 멤버가 만든 리마인더는 리스트에 그대로 남는다.
      operationId: removeListMember
      parameters:
        - $ref: "#/components/parameters/MemberListId"
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 제거 성공 (data는 null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "400":
          description: 소유자를 제거하거나 소유자가 나가려 함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          description: 리스트를 찾을 수 없음 (멤버가 아닌 리스트 포함), 또는 userId가 멤버가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reminders:
    get:
      tags: [Reminders]
      summary: 리마인더 전체 조회
      operationId: getReminders
      parameters:
        - name: listId
          in: query
          required: false
          description: 지정하면 해당 리스트의 최상위 리마인더만 표시 순서(sortOrder)대로 조회하고, 하위 작업은 각 항목의 subtasks에 담는다. listId와 tag를 모두 생략하면 하위 작업을 포함한 전체를 생성순으로 조회하고, 둘 다 지정하면 listId가 우선한다. 없거나 다른 사용자의 리스트면 404.
          schema:
            type: integer
            format: int64
        - name: tag
          in: query
          required: false
          description: 지정하면 이 이름의 태그가 붙은 리마인더만 생성순으로 조회한다. 하위 작업도 개별 항목으로 포함된다.
          schema:
            type: string
            example: 집
      responses:
        "200":
          description: 리마인더 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderArrayApiResponse"
        "404":
          description: listId에 해당하는 리스트를 찾을 수 없음 (다른 사용자의 리스트 포함)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Reminders]
      summary: 리마인더 생성 (같은 리스트의 마지막 순서로 추가)
      description: |
        tagNames의 태그 중 없는 태그는 새로 만든다.
        parentId를 지정하면 그 리마인더의 하위 작업으로 만든다. 하위 작업은 listId와 관계없이 부모의 리스트에 속하고, 부모의 하위 작업 중 마지막 순서로 추가된다.
        하위 작업의 하위 작업은 만들 수 없다 (깊이 1단계).
        repeatRule로 반복을 설정할 수 있으며, 반복은 dueAt이 있을 때만 설정할 수 있다.
      operationId: createReminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderRequest"
      responses:
        "201":
          description: 생성된 리마인더
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderApiResponse"
        "400":
          description: 유효성 검증 실패 (title 누락, 지원하지 않는 priority/repeatRule 값, 빈 태그 이름이나 50자를 넘는 태그 이름 등), dueAt 없이 반복을 지정한 경우, 또는 parentId가 이미 하위 작업인 리마인더
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: listId에 해당하는 리스트, 또는 parentId에 해당하는 리마인더를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reminders/order:
    patch:
      tags: [Reminders]
      summary: 리스트 안 리마인더 순서 일괄 변경
      description: |
        요청한 ids 순서대로 해당 리스트의 최상위 미완료 리마인더 표시 순서(sortOrder)를 0부터 다시 매긴다.
        ids에는 그 리스트의 최상위 미완료 리마인더 id가 빠짐없이 한 번씩 들어 있어야 한다 (완료 항목, 하위 작업, 다른 리스트의 항목은 넣을 수 없다).
        스마트 뷰의 정렬에는 영향을 주지 않는다.
      operationId: reorderReminders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderOrderRequest"
      responses:
        "200":
          description: 변경 성공 (data는 null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "400":
          description: listId/ids 누락, 또는 ids가 대상 리마인더와 정확히 일치하지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: listId에 해당하는 리스트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reminders/smart/{view}:
    get:
      tags: [Reminders]
      summary: 스마트 뷰 조회
      description: |
        조건에 맞는 리마인더를 자동으로 모아 보여주는 뷰. 리스트 안 순서 변경(sortOrder)과 무관하게 아래 정렬을 따른다.
        하위 작업도 조건에 맞으면 개별 항목으로 포함된다.
        - `today`: 마감일이 오늘인 미완료
        - `scheduled`: 마감일이 설정된 모든 미완료 (마감일 순)
        - `all`: 모든 미완료
        - `flagged`: flagged=true 인 미완료
        - `completed`: completed=true 인 리마인더 (완료일시 최신순)
      operationId: getSmartReminders
      parameters:
        - name: view
          in: path
          required: true
          schema:
            type: string
            enum: [today, scheduled, all, flagged, completed]
      responses:
        "200":
          description: 뷰 조건에 맞는 리마인더 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderArrayApiResponse"
        "400":
          description: 지원하지 않는 뷰 이름
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reminders/upcoming:
    get:
      tags: [Reminders]
      summary: 다가오는 리마인더 조회 (브라우저 알림 스케줄링용)
      description: |
        마감일시가 [from, to) 기간에 있는 미완료 리마인더를 마감일시 순(같으면 id 순)으로 조회한다.
        from은 포함하고 to는 포함하지 않는다. 하위 작업도 개별 항목으로 포함된다.
      operationId: getUpcomingReminders
      parameters:
        - name: from
          in: query
          required: true
          description: 기간 시작 (포함, 타임존 없는 로컬 일시)
          schema:
            type: string
            format: date-time
            example: "2026-10-04T21:00:00"
        - name: to
          in: query
          required: true
          description: 기간 끝 (미포함, 타임존 없는 로컬 일시). from보다 늦어야 한다.
          schema:
            type: string
            format: date-time
            example: "2026-10-04T21:02:00"
      responses:
        "200":
          description: 기간 안에 마감되는 미완료 리마인더 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderArrayApiResponse"
        "400":
          description: from/to 누락, 일시 형식 오류, 또는 from이 to보다 늦거나 같음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reminders/{id}/flag:
    patch:
      tags: [Reminders]
      summary: 리마인더 플래그 상태 토글
      operationId: toggleReminderFlag
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      responses:
        "200":
          description: 플래그 상태가 토글된 리마인더
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderApiResponse"
        "404":
          description: 리마인더를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reminders/{id}/complete:
    patch:
      tags: [Reminders]
      summary: 리마인더 완료 상태 토글
      description: |
        완료 처리하면 아직 완료되지 않은 하위 작업도 함께 완료된다. 완료를 취소할 때는 하위 작업의 상태를 바꾸지 않는다.
        반복 리마인더(repeatRule이 NONE이 아님)를 완료하면 다음 마감일시로 제목/메모/플래그/우선순위/태그/리스트/반복 주기를 복사한 새 리마인더를 만든다.
        - 최상위 리마인더의 다음 회차는 같은 리스트의 마지막 순서로, 하위 작업의 다음 회차는 같은 부모의 마지막 하위 작업으로 추가된다. 하위 작업은 복사하지 않는다.
        - 완료를 취소해도 이미 만든 다음 회차는 유지되며, 다시 완료해도 다음 회차를 또 만들지 않는다.
        - 부모 완료로 함께 완료된 하위 작업은 반복이어도 다음 회차를 만들지 않는다.
        응답 data는 완료 상태가 토글된 현재 리마인더이며, 새 회차는 목록 조회로 확인한다.
      operationId: toggleReminderComplete
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      responses:
        "200":
          description: 완료 상태가 토글된 리마인더
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderApiResponse"
        "404":
          description: 리마인더를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reminders/{id}:
    put:
      tags: [Reminders]
      summary: 리마인더 수정 (제목/메모/마감일시/플래그/우선순위/태그/반복 전체 교체)
      description: 요청 본문의 값으로 제목, 메모, 마감일시, 플래그, 우선순위, 태그, 반복 주기를 교체한다. memo/dueAt을 생략하거나 null로 보내면 비워지고, priority/repeatRule을 생략하거나 null로 보내면 NONE이 되며, tagNames를 생략하거나 null로 보내면 태그가 모두 떨어진다. flagged는 필수다. 완료 상태와 소속 리스트는 변경되지 않는다. dueAt 없이 반복을 지정하면 400.
      operationId: updateReminder
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderUpdateRequest"
      responses:
        "200":
          description: 수정된 리마인더
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderApiResponse"
        "400":
          description: 유효성 검증 실패 (title 누락, 지원하지 않는 priority/repeatRule 값, 빈 태그 이름이나 50자를 넘는 태그 이름 등), 또는 dueAt 없이 반복을 지정한 경우
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 리마인더를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Reminders]
      summary: 리마인더 삭제
      description: 하위 작업이 있으면 함께 삭제된다. 하위 작업을 삭제하면 부모와 다른 하위 작업은 유지된다.
      operationId: deleteReminder
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      responses:
        "200":
          description: 삭제 성공 (data는 null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "404":
          description: 리마인더를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/tags:
    get:
      tags: [Tags]
      summary: 태그 목록 조회 (이름순, 미완료 리마인더 개수 포함)
      description: 어떤 리마인더에도 붙어 있지 않은 태그는 제외한다.
      operationId: getTags
      responses:
        "200":
          description: 태그 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagArrayApiResponse"

  /api/tags/{id}:
    delete:
      tags: [Tags]
      summary: 태그 삭제 (리마인더에서 떼어내고 리마인더 자체는 유지)
      operationId: deleteTag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 삭제 성공 (data는 null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "404":
          description: 태그를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: 회원가입/로그인 응답의 Set-Cookie로 발급되는 세션 쿠키 (`HttpOnly`, `SameSite=Lax`)

  responses:
    Unauthorized:
      description: 로그인하지 않음 (세션 쿠키가 없거나 만료됨). 로그인이 필요한 모든 API에 공통으로 적용된다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            resultCode: UNAUTHORIZED
            resultMsg: 로그인이 필요합니다.
            data: null

    OwnerOnly:
      description: 리스트 멤버지만 소유자가 아님 (리스트 수정/삭제와 멤버 관리는 소유자만 할 수 있다)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            resultCode: FORBIDDEN
            resultMsg: "Only the list owner can do this: 1"
            data: null

  parameters:
    ListId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    MemberListId:
      name: listId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    ReminderId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    ReminderRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          example: 우유 사기
        memo:
          type: string
          nullable: true
          example: 저지방
        listId:
          type: integer
          format: int64
          nullable: true
          description: 소속 리스트 ID. 생략하면 리스트 없이 생성된다. parentId를 지정하면 무시된다.
        parentId:
          type: integer
          format: int64
          nullable: true
          description: 부모 리마인더 ID. 지정하면 하위 작업으로 생성되며 부모의 리스트에 속한다. 하위 작업은 부모가 될 수 없다.
        dueAt:
          type: string
          format: date-time
          nullable: true
          description: 마감 일시 (타임존 없는 로컬 일시, 예 2026-09-20T18:30:00)
          example: "2026-09-20T18:30:00"
        priority:
          allOf:
            - $ref: "#/components/schemas/Priority"
          nullable: true
          description: 우선순위. 생략하거나 null이면 NONE으로 저장된다.
        tagNames:
          $ref: "#/components/schemas/TagNames"
        repeatRule:
          allOf:
            - $ref: "#/components/schemas/RepeatRule"
          nullable: true
          description: 반복 주기. 생략하거나 null이면 NONE으로 저장된다. NONE이 아니면 dueAt이 필요하다.

    ReminderUpdateRequest:
      type: object
      required: [title, flagged]
      properties:
        title:
          type: string
          minLength: 1
          example: 계란 사기
        memo:
          type: string
          nullable: true
          example: 12구
        dueAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-09-21T09:00:00"
        flagged:
          type: boolean
        priority:
          allOf:
            - $ref: "#/components/schemas/Priority"
          nullable: true
          description: 우선순위. 생략하거나 null이면 NONE으로 바뀐다.
        tagNames:
          $ref: "#/components/schemas/TagNames"
        repeatRule:
          allOf:
            - $ref: "#/components/schemas/RepeatRule"
          nullable: true
          description: 반복 주기. 생략하거나 null이면 NONE으로 바뀐다. NONE이 아니면 dueAt이 필요하다.

    TagNames:
      type: array
      nullable: true
      description: 붙일 태그 이름 목록. 앞뒤 공백은 제거되고 중복은 하나로 합쳐지며, 없는 태그는 새로 만든다. 생략하거나 null이면 태그 없음.
      items:
        type: string
        minLength: 1
        maxLength: 50
      example: [집, 심부름]

    ListOrderRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          description: 새 표시 순서대로 나열한 모든 리스트의 id
          items:
            type: integer
            format: int64
          example: [3, 1, 2]

    ReminderOrderRequest:
      type: object
      required: [listId, ids]
      properties:
        listId:
          type: integer
          format: int64
        ids:
          type: array
          description: 새 표시 순서대로 나열한, 해당 리스트의 모든 미완료 리마인더 id
          items:
            type: integer
            format: int64
          example: [12, 10, 11]

    Priority:
      type: string
      enum: [NONE, LOW, MEDIUM, HIGH]
      description: 리마인더 우선순위 (없음/낮음/보통/높음). 목록에서는 LOW/MEDIUM/HIGH를 각각 !, !!, !!!로 표시한다.
      example: HIGH

    RepeatRule:
      type: string
      enum: [NONE, DAILY, WEEKLY, MONTHLY, YEARLY]
      description: |
        반복 주기 (반복 안 함/매일/매주/매월/매년). 다음 마감일시는 현재 마감일시에 주기를 더해 계산한다.
        매월/매년 반복에서 같은 날짜가 없으면 그 달의 말일로 맞춘다 (1월 31일 → 2월 28일 또는 29일, 2월 29일 → 다음 해 2월 28일).
      example: WEEKLY

    ReminderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        memo:
          type: string
          nullable: true
        completed:
          type: boolean
        flagged:
          type: boolean
        priority:
          $ref: "#/components/schemas/Priority"
        dueAt:
          type: string
          format: date-time
          nullable: true
        repeatRule:
          $ref: "#/components/schemas/RepeatRule"
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: 완료 처리한 일시. 미완료 상태이면 null
        listId:
          type: integer
          format: int64
          nullable: true
        sortOrder:
          type: integer
          description: 같은 리스트 안의 표시 순서(하위 작업은 부모 안에서의 순서). 작을수록 위
        tags:
          type: array
          description: 붙은 태그 이름 목록 (이름순)
          items:
            type: string
          example: [심부름, 집]
        parentId:
          type: integer
          format: int64
          nullable: true
          description: 부모 리마인더 ID. 최상위 리마인더이면 null
        subtasks:
          type: array
          description: 하위 작업 목록 (부모 안의 순서대로). 하위 작업 자신의 subtasks는 항상 빈 배열이다.
          items:
            $ref: "#/components/schemas/ReminderResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReminderListRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: 장보기
        color:
          type: string
          nullable: true
          pattern: "^#[0-9a-fA-F]{6}$"
          example: "#FF9500"

    ReminderListResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        color:
          type: string
          nullable: true
        sortOrder:
          type: integer
          description: 소유자의 사이드바 표시 순서. 작을수록 위 (공유받은 리스트에서는 의미 없음)
        reminderCount:
          type: integer
          format: int64
          description: 리스트에 속한 최상위 미완료 리마인더 개수 (하위 작업 제외, 다른 멤버가 만든 것 포함)
        role:
          $ref: "#/components/schemas/ListRole"
        memberCount:
          type: integer
          format: int64
          description: 소유자를 포함한 멤버 수. 2 이상이면 공유된 리스트다.
          example: 2
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ListRole:
      type: string
      enum: [OWNER, EDITOR]
      description: 리스트에서의 역할. OWNER는 리스트 수정/삭제와 멤버 관리까지, EDITOR는 리마인더만 다룰 수 있다.
      example: EDITOR

    ListMemberRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: 초대할 사용자의 가입 이메일 (대소문자 무시)
          example: bob@example.com

    ListMemberResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
          example: bob@example.com
        name:
          type: string
          example: 밥
        role:
          $ref: "#/components/schemas/ListRole"
        joinedAt:
          type: string
          format: date-time
          description: 멤버가 된 일시 (소유자는 리스트를 만든 일시)

    TagResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: 집
        reminderCount:
          type: integer
          format: int64
          description: 이 태그가 붙은 미완료 리마인더 개수
        createdAt:
          type: string
          format: date-time

    ApiResult:
      type: object
      description: 모든 API 응답에 공통으로 포함되는 결과 코드와 메시지
      required: [resultCode, resultMsg]
      properties:
        resultCode:
          type: string
          enum: [SUCCESS, BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, METHOD_NOT_ALLOWED, INTERNAL_SERVER_ERROR]
          description: |
            - `SUCCESS`: 성공
            - `BAD_REQUEST`: 유효성 검증 실패, 본문 형식 오류, 지원하지 않는 값 등 4xx 요청 오류
            - `UNAUTHORIZED`: 로그인하지 않음, 또는 이메일/비밀번호가 틀림 (401)
            - `FORBIDDEN`: 리스트 멤버지만 소유자 권한이 필요한 작업 (403)
            - `NOT_FOUND`: 대상을 찾을 수 없음 (다른 사용자의 리소스, 멤버가 아닌 리스트 포함)
            - `CONFLICT`: 이미 존재하는 대상 (예: 가입된 이메일, 409)
            - `METHOD_NOT_ALLOWED`: 지원하지 않는 HTTP 메서드
            - `INTERNAL_SERVER_ERROR`: 서버 오류
          example: SUCCESS
        resultMsg:
          type: string
          description: '결과 메시지. 성공 시 "성공", 실패 시 원인 (유효성 검증 실패는 "필드: 메시지"를 쉼표로 연결)'
          example: 성공

    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 100
          description: 로그인 아이디. 소문자로 정규화해 저장한다.
          example: alice@example.com
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 8자 이상, UTF-8 72바이트 이하 (BCrypt 제한)
          example: password1
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: 앨리스

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: alice@example.com
        password:
          type: string
          example: password1

    UserResponse:
      type: object
      description: 사용자 정보 (비밀번호는 포함하지 않는다)
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          example: alice@example.com
        name:
          type: string
          example: 앨리스
        createdAt:
          type: string
          format: date-time

    UserApiResponse:
